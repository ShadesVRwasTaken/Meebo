<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meebo Bot Host Console</title>
<style>
body { font-family: sans-serif; background-color: #1a1a24; color: #fff; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
h1 { color: #0ebd84; }
.status-card { background-color: #242432; border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #333344; }
#screen-log { background: #000; color: #0f0; text-align: left; font-family: monospace; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 20px; font-size: 0.85em; }
</style>
<!-- 📦 This loads the official browser bundle safely -->
<script src="https://jsdelivr.net"></script>
</head>
<body>

<h1>🤖 Meebo Live Host</h1>
<div class="status-card">
<p style="color: #ff9800; font-weight: bold;">⚠️ Keep this browser tab open!</p>
</div>

<h3>📡 Live Connection Logs:</h3>
<div id="screen-log">Initializing log window...</div>

<script>
const logDiv = document.getElementById('screen-log');
logDiv.innerHTML = "=== Meebo Boot Sequence ===\n";

// Setup screen logging before loading meebo's brain script
window.logToScreen = function(msg, isError = false) {
const prefix = isError ? "🔴 ERROR: " : "🟢 ";
logDiv.innerHTML += `${prefix}${msg}\n`;
logDiv.scrollTop = logDiv.scrollHeight;
};
</script>

<!-- Run the bot brain -->
<script src="meebo.js"></script>
</body>
</html>
